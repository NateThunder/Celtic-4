# Secret shopper: proves the shop works for a real customer, automatically.
#
# 1. Pull requests: builds the PROPOSED code here on GitHub, starts it, and shops
#    it. It never tests the old live site: it must report the pull request's own
#    version or the run stops. It shops a fake WooCommerce made from a read-only
#    copy of the real catalogue, and the real shop is blocked at the network level
#    before any pull request code runs. That guards against ACCIDENTAL access to
#    real carts by buggy code. It is not a guarantee against a deliberately
#    malicious pull request, which could edit this file; that residual risk is
#    accepted. This file can't limit who opens pull requests: that relies on the
#    repository's access and Actions approval settings, which must be checked
#    (Settings > Actions > General > approval for outside contributors). The real shop
#    is proven after merge, by step 2.
# 2. Every push to main: waits until SiteGround has actually deployed that exact
#    version (up to 20 minutes), then shops the live website. If the deploy never
#    shows up, the run fails and says so.
# 3. Every morning at 07:17 UTC (07:17 UK in winter, 08:17 in summer): shops the
#    live website and checks it is on the latest version of main.
# 4. By hand: Actions tab > Secret shopper > Run workflow.
#
# Any failure fails the run with a clear list of problems on the run's page, and
# GitHub emails whoever triggered it (for the daily run, whoever last changed this
# file).
#
# Safety: this workflow deploys nothing. It uses no passwords, keys or payment
# details, its GitHub access is read-only and is not kept after checkout, and the
# shopper never opens checkout, so it creates no orders and holds no stock. Every
# test uses a brand-new visitor whose cart only it can touch.
name: Secret shopper

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: a newer push to the same pull request replaces the older check.
# Main and daily runs: one group per commit and never cancelled, so each run
# finishes. If a newer change replaces the site before or during a check, that
# older run fails and says so, and the newer change's own run does the real check.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('shopper-pr-{0}', github.ref) || format('shopper-{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- 1. PR
  catalogue-copy:
    name: Copy the real catalogue (read-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Runs NO code from the repository or the pull request: no checkout at all.
      # Only GET requests to the public product list, using Python's standard
      # library. Only the resulting catalogue data is passed to the next job.
      - name: Copy the catalogue (GET requests only)
        run: |
          mkdir -p "$RUNNER_TEMP/woo"
          python3 - "$RUNNER_TEMP/woo/catalogue.json" <<'PY'
          import json, sys, time, urllib.request
          BASE = "https://cms.celticworship.co.uk/wp-json/wc/store/v1"
          def get(path):
              sep = "&" if "?" in path else "?"
              req = urllib.request.Request(f"{BASE}{path}{sep}_copy={int(time.time())}", headers={"Accept": "application/json", "User-Agent": "CelticWorshipSecretShopper/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)
          def everything(path):
              items = []
              for page in range(1, 21):
                  sep = "&" if "?" in path else "?"
                  batch = get(f"{path}{sep}per_page=100&page={page}")
                  if not isinstance(batch, list): raise SystemExit(f"{path} did not return a list")
                  items += batch
                  if len(batch) < 100: return items
              raise SystemExit(f"{path} has more than 2,000 items")
          products = everything("/products?orderby=date&order=desc")
          if not products: raise SystemExit("WooCommerce returned no products to copy")
          categories = everything("/products/categories")
          variations = {str(p["id"]): everything(f"/products?type=variation&parent={p['id']}") for p in products if p.get("type") == "variable"}
          json.dump({"takenAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "products": products, "categories": categories, "variations": variations}, open(sys.argv[1], "w"))
          print(f"Copied {len(products)} products, {sum(len(v) for v in variations.values())} options and {len(categories)} categories (read-only).")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalogue-copy
          path: ${{ runner.temp }}/woo/catalogue.json
          retention-days: 1

  proposed-code:
    name: Shop the proposed code (pull request)
    if: github.event_name == 'pull_request'
    needs: catalogue-copy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to exact versions (actions/checkout v4.2.2, actions/setup-node v4.4.0)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      # The catalogue data from the job above. No pull request code has run yet.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalogue-copy
          path: ${{ runner.temp }}/woo

      # Protects against ACCIDENTAL access to the real shop by pull request code
      # (for example a bug that calls the live site). It is not a security boundary
      # against a deliberately malicious change: a pull request can edit this file,
      # and code on this machine could undo these rules. That residual risk is
      # accepted. Who can open pull requests that run here is controlled by the
      # repository's access and Actions approval settings, not by this file.
      - name: Block the real shop for the rest of this job
        run: |
          # 1. Look up each address ONCE and keep the list. Every host must resolve.
          : > "$RUNNER_TEMP/blocked-addresses"
          for host in cms.celticworship.co.uk celticworship.co.uk www.celticworship.co.uk; do
            v4=$(getent ahostsv4 "$host" | awk '{print $1}' | sort -u)
            v6=$(getent ahostsv6 "$host" | awk '{print $1}' | grep ':' | grep -v '^::ffff:' | sort -u || true)
            if [ -z "$v4$v6" ]; then echo "::error::Couldn't look up $host, so the block couldn't be set up. Stopped before running any pull request code."; exit 1; fi
            for ip in $v4; do echo "$host 4 $ip" >> "$RUNNER_TEMP/blocked-addresses"; done
            for ip in $v6; do echo "$host 6 $ip" >> "$RUNNER_TEMP/blocked-addresses"; done
          done

          # 2. Block exactly those addresses, then confirm each rule is in place.
          while read -r host family ip; do
            if [ "$family" = 4 ]; then sudo iptables -I OUTPUT -d "$ip" -j REJECT --reject-with icmp-port-unreachable
            else sudo ip6tables -I OUTPUT -d "$ip" -j REJECT --reject-with icmp6-port-unreachable; fi
          done < "$RUNNER_TEMP/blocked-addresses"
          while read -r host family ip; do
            if [ "$family" = 4 ]; then sudo iptables -C OUTPUT -d "$ip" -j REJECT --reject-with icmp-port-unreachable
            else sudo ip6tables -C OUTPUT -d "$ip" -j REJECT --reject-with icmp6-port-unreachable; fi \
              || { echo "::error::Block rule for $host ($ip) is missing. Stopped."; exit 1; }
          done < "$RUNNER_TEMP/blocked-addresses"

          # 3. Prove it, address by address (both IPv4 and IPv6, no name lookups).
          #    Only "couldn't connect" (curl exit code 7) counts as blocked. Any other
          #    result, including a certificate error, means something was reached.
          while read -r host family ip; do
            target="$ip"; [ "$family" = 6 ] && target="[$ip]"
            code=0
            curl -s -o /dev/null --connect-timeout 5 --max-time 10 --resolve "$host:443:$target" "https://$host/" || code=$?
            if [ "$code" -ne 7 ]; then
              echo "::error::$host ($ip) did not show as blocked (curl exit code $code). Stopped before running any pull request code."; exit 1
            fi
          done < "$RUNNER_TEMP/blocked-addresses"
          echo "Real shop blocked and verified on $(wc -l < "$RUNNER_TEMP/blocked-addresses") address(es):"; cat "$RUNNER_TEMP/blocked-addresses"

      - name: Start the fake WooCommerce
        run: |
          nohup node scripts/fake-woocommerce.mjs "$RUNNER_TEMP/woo" > "$RUNNER_TEMP/fake-woo.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf --connect-timeout 2 --max-time 5 "http://127.0.0.1:4000/wp-json/wc/store/v1/products" > /dev/null && exit 0
            sleep 1
          done
          echo "::error::The fake WooCommerce did not start."; cat "$RUNNER_TEMP/fake-woo.log"; exit 1

      - name: Install the proposed website
        run: npm ci --no-audit --no-fund

      # The SiteGround build skips type checking to stay under its 5-minute limit,
      # so it happens here instead.
      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Build the proposed website (pointed at the fake WooCommerce)
        env:
          NEXT_PUBLIC_WOO_URL: http://127.0.0.1:4000
        run: npm run build

      - name: Start it on this machine
        env:
          NEXT_PUBLIC_WOO_URL: http://127.0.0.1:4000
        run: |
          nohup npx next start -p 3000 -H 127.0.0.1 > "$RUNNER_TEMP/site.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf --connect-timeout 5 --max-time 15 http://127.0.0.1:3000/api/internal/catalog-status > /dev/null && exit 0
            sleep 2
          done
          echo "::error::The proposed website did not start."; cat "$RUNNER_TEMP/site.log"; exit 1

      - name: Install the test browser
        run: |
          mkdir -p "$RUNNER_TEMP/shopper"
          cp scripts/secret-shopper.mjs "$RUNNER_TEMP/shopper/"
          cd "$RUNNER_TEMP/shopper"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Shop like a customer
        working-directory: ${{ runner.temp }}/shopper
        env:
          SITE_URL: http://127.0.0.1:3000
          WOO_URL: http://127.0.0.1:4000
          EXPECT_COMMIT: ${{ github.sha }}
        run: node secret-shopper.mjs

      - name: Logs (if anything failed)
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/site.log" || true
          tail -n 50 "$RUNNER_TEMP/fake-woo.log" || true

  # ------------------------------------------- 2, 3, 4. the live website
  live-site:
    name: Shop the live website
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install the test browser
        run: |
          mkdir -p "$RUNNER_TEMP/shopper"
          cp scripts/secret-shopper.mjs "$RUNNER_TEMP/shopper/"
          cd "$RUNNER_TEMP/shopper"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Wait for SiteGround to deploy this version
        if: github.event_name == 'push'
        run: |
          deadline=$((SECONDS + 1200))   # 20 minutes, however long each check takes
          live=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            left=$((deadline - SECONDS)); wait_for=$(( left < 20 ? left : 20 ))
            [ "$wait_for" -lt 1 ] && break
            body=$(curl -s --connect-timeout "$(( wait_for < 10 ? wait_for : 10 ))" --max-time "$wait_for" "https://celticworship.co.uk/api/internal/catalog-status?_t=$(date +%s)" || true)
            live=$(printf '%s' "$body" | python3 -c 'import sys, json
          try: print(json.load(sys.stdin).get("commit", ""))
          except Exception: print("")' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Live site is now on $GITHUB_SHA"; exit 0; fi
            echo "Live site is on ${live:-an unreadable or unknown version}, waiting for $GITHUB_SHA"
            left=$((deadline - SECONDS)); [ "$left" -gt 0 ] && sleep $(( left < 30 ? left : 30 ))
          done
          msg="After 20 minutes celticworship.co.uk is on ${live:-an unreadable or unknown version}, not $GITHUB_SHA. Either the deploy failed or got stuck (check SiteGround > Node.js > Logs), or a newer change replaced it first, in which case that change's own run checks it."
          echo "::error::DEPLOY NOT CONFIRMED: $msg"
          { echo "## ❌ Deploy not confirmed"; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Shop like a customer
        working-directory: ${{ runner.temp }}/shopper
        env:
          SITE_URL: https://celticworship.co.uk
          # The live site must be on the latest main (by hand on another branch: just shop).
          EXPECT_COMMIT: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
        run: node secret-shopper.mjs
