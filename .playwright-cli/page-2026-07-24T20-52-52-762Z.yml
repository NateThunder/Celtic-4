        - heading "About The Band" [level=2] [ref=f6e26]
        - paragraph [ref=f6e27]: Celtic Worship is an authentic expression of sung worship deeply rooted in the sound and traditions of Scottish music. As a collective of some of Scotland's finest contemporary musicians, they share a deep desire to use their skills and giftings to praise and make known Jesus Christ. Exploring psalms, hymns and new songs, their uniquely powerful pipes-and-fiddle-led sound communicates the full range and depth of the Gospel.
        - paragraph [ref=f6e28]: Since starting their journey in 2016, the group have released several studio albums, played all over Scotland, the UK, and Europe, and had numerous television and radio appearances.
        - paragraph [ref=f6e29]: 2025 marks the release of 'Harvest', the group's 4th studio album, written and arranged at a family farm in Morayshire. Surrounded by fields ripe for harvest, the band drew deeply from the rich biblical vein of harvest imagery to celebrate God's faithfulness, His promises, and new life in Christ. Inspired by golden landscapes and long summer days at Cowfords Farm, Harvest reflects both the physical beauty of the season and a deeper sense of spiritual growth for the band.
